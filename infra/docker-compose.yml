services:
  mysql:
    image: mysql:8.0
    container_name: edusphere_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: edusphere
      MYSQL_USER: edusphere_user
      MYSQL_PASSWORD: edusphere_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - edusphere_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: edusphere_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - edusphere_network

volumes:
  mysql_data:

networks:
  edusphere_network:
    driver: bridge
